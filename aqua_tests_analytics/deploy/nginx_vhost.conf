server {
    listen 80;
    # listen 443 ssl; # Uncomment for HTTPS
    server_name your_domain.com www.your_domain.com; # Replace with your server's domain/IP

    # SSL Configuration (example, uncomment and configure if using HTTPS)
    # ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Max file size for uploads (e.g., 4GB)
    client_max_body_size 4G;

    location /static {
        alias /opt/aqua-tests/app/static; # Path to your app's static files
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/opt/aqua-tests/aqua-tests.sock; # Match Gunicorn socket
        # If Gunicorn binds to host:port:
        # proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s; # 1 hour for long uploads/requests
        proxy_send_timeout 3600s;
    }

    # Optional: Deny access to .env or other sensitive files if webroot is misconfigured
    location ~ /\.env {
        deny all;
    }
}
