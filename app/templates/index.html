<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <title>Test-Analytics</title>
  </head>
  <body>
    <div class="container">
        <h1 class="mt-5">Test-Analytics</h1>
        <div class="accordion mt-4" id="panelsAccordion">
            {% for panel in panels_data %}
            <div class="card">
                <div class="card-header" id="heading-{{ panel.id }}">
                    <h2 class="mb-0">
                        <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#collapse-{{ panel.id }}" aria-expanded="true" aria-controls="collapse-{{ panel.id }}">
                            {{ panel.name }}
                        </button>
                    </h2>
                </div>

                <div id="collapse-{{ panel.id }}" class="collapse" aria-labelledby="heading-{{ panel.id }}" data-parent="#panelsAccordion">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Version</th>
                                    <th>Pass Rate</th>
                                    <th>Summary</th>
                                    <th>Timestamp</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for version in panel.versions %}
                                <tr>
                                    <td><a href="{{ url_for('main.version_metrics', panel_name=panel.name, version_name=version.name) }}">{{ version.name }}</a></td>
                                    <td>{{ "%.2f"|format(version.pass_rate) }}%</td>
                                    <td>{{ version.tests_summary }}</td>
                                    <td>{{ version.timestamp|datetimeformat }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            {% for panel in panels %}
            var ctx = document.getElementById('sparkline-{{ loop.index }}').getContext('2d');
            var chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from(Array({{ panel.pass_rate_trend|length }}).keys()),
                    datasets: [{
                        data: {{ panel.pass_rate_trend|tojson }},
                        borderColor: 'rgba(0, 123, 255, 0.5)',
                        borderWidth: 2,
                        fill: false,
                        pointRadius: 0
                    }]
                },
                options: {
                    scales: {
                        y: {
                            display: false
                        },
                        x: {
                            display: false
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    elements: {
                        line: {
                            tension: 0.4
                        }
                    }
                }
            });
            {% endfor %}
        });
    </script>
  </body>
</html>
