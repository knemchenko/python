name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy src --strict

      - name: Test with pytest and check coverage
        run: |
          pip install pytest pytest-cov pytest-json-report
          pytest --cov=src --cov-report=term-missing --cov-fail-under=80 --json-report --json-report-file=report.json

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.json
