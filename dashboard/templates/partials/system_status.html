<li class="list-group-item d-flex justify-content-between align-items-center">
    <span>RETRAIN_REQUIRED Flag</span>
    {% if status.retrain_required %}
        <span class="badge bg-danger">Present</span>
    {% else %}
        <span class="badge bg-success">Not Present</span>
    {% endif %}
</li>
<li class="list-group-item d-flex justify-content-between align-items-center">
    <span>Cache Size</span>
    <span class="badge bg-info">{{ status.cache_size }}</span>
</li>
<li class="list-group-item d-flex justify-content-between align-items-center">
    <span>Last Retrain Date</span>
    <span class="badge bg-secondary">{{ status.last_retrain_date }}</span>
</li>
