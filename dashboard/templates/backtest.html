{% extends "layout.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Backtest & Performance</h2>

    <div class="row">
        <!-- Sharpe Ratio Heatmap -->
        <div class="col-lg-8 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Sharpe Ratio by Ticker & Horizon</h5>
                    <div id="heatmap-chart" style="height: 400px;"></div>
                    <p class="small text-muted mt-2">Heatmap showing the historical Sharpe Ratio for each combination of ticker and forecast horizon.</p>
                </div>
            </div>
        </div>

        <!-- P/L by Year Table -->
        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">P/L by Year</h5>
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Total P/L</th>
                                <th>Win Rate</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be populated here -->
                            <tr><td>2022</td><td class="text-success">+15.8%</td><td>68%</td></tr>
                            <tr><td>2023</td><td class="text-success">+25.2%</td><td>71%</td></tr>
                            <tr><td>2024</td><td class="text-danger">-5.1%</td><td>48%</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const heatmapDiv = document.getElementById('heatmap-chart');

    fetch("{{ url_for('api_sharpe_heatmap') }}")
        .then(response => response.json())
        .then(data => {
            const plotData = [{
                z: data.z,
                x: data.x,
                y: data.y,
                type: 'heatmap',
                colorscale: 'Viridis'
            }];

            const layout = {
                title: 'Sharpe Ratio Heatmap',
                xaxis: { title: 'Horizon (Days)' },
                yaxis: { title: 'Ticker' }
            };

            Plotly.newPlot(heatmapDiv, plotData, layout, {responsive: true});
        });
});
</script>
{% endblock %}
