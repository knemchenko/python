version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aqua_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-aqua_tests_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: # Defines the named volume (though in this setup, it's a bind mount)
