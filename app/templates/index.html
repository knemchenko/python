<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <title>Test-Analytics</title>
  </head>
  <body>
    <div class="container">
        <h1 class="mt-5">Test-Analytics</h1>
        <div class="accordion mt-4" id="panelsAccordion">
            {% for panel in panels_data %}
            <div class="card">
                <div class="card-header" id="heading-panel-{{ panel.id }}">
                    <h2 class="mb-0">
                        <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#collapse-panel-{{ panel.id }}">
                            {{ panel.name }}
                        </button>
                    </h2>
                </div>
                <div id="collapse-panel-{{ panel.id }}" class="collapse" data-parent="#panelsAccordion">
                    <div class="card-body">
                        <div class="accordion" id="versionsAccordion-{{ panel.id }}">
                            {% for version in panel.versions %}
                            <div class="card">
                                <div class="card-header" id="heading-version-{{ panel.id }}-{{ loop.index }}">
                                    <h2 class="mb-0">
                                        <button class="btn btn-link btn-block text-left collapsed" type="button" data-toggle="collapse" data-target="#collapse-version-{{ panel.id }}-{{ loop.index }}">
                                            Version: {{ version.name }} <small class="text-muted ml-3">{{ version.timestamp|datetimeformat }}</small>
                                        </button>
                                    </h2>
                                </div>
                                <div id="collapse-version-{{ panel.id }}-{{ loop.index }}" class="collapse" data-parent="#versionsAccordion-{{ panel.id }}">
                                    <div class="card-body">
                                        <ul class="list-group">
                                            {% for module in version.modules %}
                                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                                <a href="{{ url_for('main.uploaded_file', filename=version.report_path|relpath) }}">{{ module.name }}</a>
                                                <span class="badge badge-success badge-pill mr-2">Passed: {{ module.passed }}</span>
                                                <span class="badge badge-danger badge-pill mr-2">Failed: {{ module.failed }}</span>
                                                <span class="badge badge-info badge-pill">Total: {{ module.total }}</span>
                                            </li>
                                            {% endfor %}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            {% for panel in panels %}
            var ctx = document.getElementById('sparkline-{{ loop.index }}').getContext('2d');
            var chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from(Array({{ panel.pass_rate_trend|length }}).keys()),
                    datasets: [{
                        data: {{ panel.pass_rate_trend|tojson }},
                        borderColor: 'rgba(0, 123, 255, 0.5)',
                        borderWidth: 2,
                        fill: false,
                        pointRadius: 0
                    }]
                },
                options: {
                    scales: {
                        y: {
                            display: false
                        },
                        x: {
                            display: false
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    elements: {
                        line: {
                            tension: 0.4
                        }
                    }
                }
            });
            {% endfor %}
        });
    </script>
  </body>
</html>
