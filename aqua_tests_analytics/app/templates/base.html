<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Test Analytics{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color-light: #ffffff;
            --text-color-light: #212529;
            --bg-color-dark: #343a40;
            --text-color-dark: #f8f9fa;
        }
        body {
            background-color: var(--bg-color-light);
            color: var(--text-color-light);
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: var(--bg-color-dark);
                color: var(--text-color-dark);
            }
            .table, .list-group-item, .card { /* Adjust Bootstrap components for dark mode */
                background-color: var(--bg-color-dark) !important; /* Added !important for specificity */
                color: var(--text-color-dark) !important;
                border-color: #454d55; /* For borders like on cards/list-group-items */
            }
            .navbar-light { /* Assuming it starts as navbar-light for toggler icon */
                background-color: var(--bg-color-dark) !important;
                border-bottom: 1px solid #454d55;
            }
             .navbar-light .navbar-brand, .navbar-light .nav-link, .navbar-light .navbar-toggler-icon {
                color: var(--text-color-dark) !important;
            }
            /* Ensure links in dark mode are also visible */
            a {
                color: #6cb2eb; /* A light blue, good for dark backgrounds */
            }
            a:hover {
                color: #8cbbed;
            }
            .list-group-item-action:hover {
                 background-color: #495057 !important; /* Darker hover for list items */
            }
        }
        .container { margin-top: 20px; }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="{{ url_for('main.index') }}">Test Analytics Dashboard</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="{{ url_for('main.index') }}">Home <span class="sr-only">(current)</span></a>
                </li>
                <!-- Add other nav items here if needed -->
            </ul>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
