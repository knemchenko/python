<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>Metrics for {{ panel_name }} - {{ version_name }}</title>
  </head>
  <body>
    <div class="container">
        <h1 class="mt-5">Metrics for {{ panel_name }} - {{ version_name }}</h1>

        <div class="list-group mt-4">
            {% if modules %}
                {% for module in modules %}
                    <a href="{{ url_for('main.uploaded_file', filename=report_path|relpath) }}" class="list-group-item list-group-item-action">
                        {{ module }}
                    </a>
                {% endfor %}
            {% else %}
                <p class="text-muted">No modules found for this version.</p>
            {% endif %}
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal fade" id="historyModal" tabindex="-1" role="dialog" aria-labelledby="historyModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="historyModalLabel">Test History</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <table class="table">
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Optional JavaScript -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $('#historyModal').on('show.bs.modal', function (event) {
            var button = $(event.relatedTarget);
            var history = JSON.parse(button.data('history'));
            var modal = $(this);
            var tableBody = modal.find('#history-table-body');
            tableBody.empty();
            history.forEach(function(run) {
                tableBody.append('<tr><td>' + run.status + '</td><td>' + run.duration.toFixed(2) + 's</td></tr>');
            });
        });

        $('#filter-buttons .btn').on('click', function() {
            var filter = $(this).data('filter');
            $('#filter-buttons .btn').removeClass('btn-primary').addClass('btn-outline-primary');
            $(this).removeClass('btn-outline-primary').addClass('btn-primary');

            $('#test-cases-table tr').each(function() {
                var row = $(this);
                if (filter === 'all') {
                    row.show();
                } else if (filter === 'flaky') {
                    row.data('is-flaky') ? row.show() : row.hide();
                } else if (filter === 'new_fail') {
                    row.data('is-new-fail') ? row.show() : row.hide();
                } else {
                    row.data('status') === filter ? row.show() : row.hide();
                }
            });
        });

        // Apply filter from URL on page load
        var initialFilter = '{{ active_filter }}';
        if (initialFilter && initialFilter !== 'all') {
            $('#filter-buttons .btn[data-filter="' + initialFilter + '"]').click();
        }
    </script>
  </body>
</html>
