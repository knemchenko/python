{% extends "layout.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">System Administration</h2>

    <div class="row">
        <!-- System Status -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-header">
                    System Status
                </div>
                <ul class="list-group list-group-flush" hx-get="{{ url_for('api_system_status') }}" hx-trigger="load, every 5s">
                    <!-- Status will be loaded here -->
                    <li class="list-group-item">Loading status...</li>
                </ul>
            </div>
        </div>

        <!-- Actions -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-header">
                    Actions
                </div>
                <div class="card-body">
                    <p>Trigger system actions manually.</p>
                    <button class="btn btn-warning me-2"
                            hx-post="{{ url_for('api_force_retrain') }}"
                            hx-target="#action-status"
                            hx-swap="innerHTML">
                        <i class="bi bi-robot"></i> Force Retrain
                    </button>
                    <button class="btn btn-danger"
                            hx-post="{{ url_for('api_clean_cache') }}"
                            hx-target="#action-status"
                            hx-swap="innerHTML">
                        <i class="bi bi-trash"></i> Clean Cache
                    </button>
                    <div id="action-status" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
